name: Publish

# Publishes @cclabsnz/sf-audit to npm *with build provenance*, so the npm page shows a
# verified "Built and signed on GitHub Actions" attestation linking the published tarball
# to this exact public commit. A generated CycloneDX SBOM is attached to the release.
#
# Auth is npm Trusted Publishing (OIDC) — NO long-lived npm token is stored. The job
# exchanges its GitHub OIDC id-token for a short-lived npm credential at publish time.
# One-time setup: on npmjs.com, the package's Settings -> Trusted Publishing must list a
# GitHub Actions publisher for cclabsnz/sf-audit-plugin with workflow `publish.yml`.
# See docs/RELEASE.md.
#
# Trigger is a published GitHub Release (you cut the release manually — this keeps you in
# control of when a version ships) or a manual run.
#
# Actions pinned to commit SHAs; trailing comment = human-readable version.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach SBOM asset to the release
      id-token: write # REQUIRED for npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # NOTE: no `registry-url` — it makes setup-node write an .npmrc with a
      # placeholder _authToken, which blocks npm's OIDC trusted-publishing exchange
      # (results in E404 on publish). Omitting it lets `npm publish` do the OIDC flow.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # Trusted Publishing (OIDC) needs a recent npm CLI (>= 11.5.1); the runner's Node 22
      # ships 10.x, so npm is upgraded here.
      #
      # Pinned, not `@latest`. This step runs in the job that holds the OIDC token, so an
      # unpinned global install hands whatever npm published in the last hour a credential
      # that can publish this package. 12.0.2 is the version the 1.7.0 release used.
      #
      # `--ignore-scripts` closes the remaining window: a global install runs lifecycle
      # scripts, and here they would execute alongside a credential that can publish this
      # package. npm needs no install scripts to work, so nothing is lost. (Scorecard's
      # Pinned-Dependencies alert wants a hash instead, which npm cannot do for a global
      # install — this is the security fix, not a way to clear that alert.)
      #
      # The version is then asserted rather than merely echoed. This workflow runs only on a
      # published release, so a silently failed upgrade would otherwise surface as a broken
      # publish at the worst moment; failing here is cheap and loud.
      - name: Upgrade npm (>= 11.5.1 required for OIDC trusted publishing)
        run: |
          npm install -g npm@12.0.2 --ignore-scripts
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)  (path: $(which npm))"
          if [ "$(npm -v)" != "12.0.2" ]; then
            echo "::error::npm upgrade did not take: expected 12.0.2, got $(npm -v)"
            exit 1
          fi

      - name: Publish to npm with provenance (OIDC trusted publishing)
        run: |
          node -v && npm -v
          npm publish --provenance --access public

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          # Generate only — the next step does the attaching. This input defaults to true,
          # which uploads a second, identically-sized copy of the SBOM to the release under
          # its own name (`<repo>-<job>.cyclonedx.json`). Every release up to v1.8.2 carried
          # both. Keep the explicit attachment, whose filename we control.
          upload-release-assets: "false"

      - name: Attach SBOM to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: sbom.cyclonedx.json

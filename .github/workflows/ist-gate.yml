name: IST gate
# Intent → Spec → Test link check. Added by ist-adopt: links only, so it never
# fights your existing test workflow. When you have hidden tests, add a job that
# runs them here (see ClaudeMeta/ist-template/.github/workflows/ist-gate.yml).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  links:
    name: intent→spec→test links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      # The hidden repo is not checked out here, so must-never-without-hidden-test is the one gate
      # this job cannot judge; ist/links (the external gate) runs with it mounted. Every other gate,
      # rule-without-test included, still fails this job. --hidden-dir is pinned so the PR's own
      # .ist/harness.json cannot steer which runner paths the script walks.
      - env:
          NO_HIDDEN: ${{ runner.temp }}/no-hidden
        run: |
          node scripts/ist-link-check.mjs . --local --hidden-dir "$NO_HIDDEN" || true
          node scripts/ist-link-check.mjs . --json --hidden-dir "$NO_HIDDEN" > "$RUNNER_TEMP/links.json" || true
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))
            const blocking = r.errors.filter(e => e.gate !== "must-never-without-hidden-test")
            for (const e of blocking) console.log(`::error::${e.gate} ${e.id} (${e.where})`)
            process.exit(blocking.length ? 1 : 0)
          ' "$RUNNER_TEMP/links.json"

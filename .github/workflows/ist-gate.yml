name: IST gate
# Intent → Spec → Test link check. Added by ist-adopt: links only, so it never
# fights your existing test workflow. When you have hidden tests, add a job that
# runs them here (see ClaudeMeta/ist-template/.github/workflows/ist-gate.yml).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  links:
    name: intent→spec→test links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      # --local: hidden-test coverage is a warning here, since the hidden repo is not checked out.
      # ist/links (the external gate) runs the same check with it mounted and enforces it.
      - run: node scripts/ist-link-check.mjs . --local

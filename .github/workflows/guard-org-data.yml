name: Guard org data

# Fails the build if anything identifying a real Salesforce org or customer reaches the
# repository: org, user, connected-app and platform-event ids, my.salesforce.com hostnames,
# NZ health sector email addresses, routable IP addresses, or generated audit artefacts.
# Content AND commit messages are both scanned — the messages are the part people forget.
#
# Test fixtures are excluded by shape: a real id never contains 'xx' or a long run of zeros,
# whereas fixtures conventionally do. A guard that rejects the ids its own message recommends
# gets switched off by the first developer who hits it.
#
# Do not paste a real id or host here to illustrate the rule. An earlier revision of the
# companion hook did exactly that, and the comment explaining how to spot a real id was
# itself the leak. These files are therefore scanned like any other — note the absence of an
# exemption list below.
#
# The fixture zero-run threshold is nine. It was six, which is below what real ids reach, and
# a genuine customer id cleared six in this repo. Keep in step with .githooks/pre-commit.
#
# POSIX ERE throughout — GitHub runners have GNU grep, but these patterns are shared with the
# local hook, which runs on BSD grep where -P does not exist. ERE has no negative lookahead,
# so fixtures are removed by filtering the EXTRACTED matches rather than by an inline (?!...).
# An earlier revision used (?!...) with -E: it silently matched nothing, so every real host
# passed while the step still reported "clean". Filtering extracted matches rather than whole
# lines also matters on its own - per line, a line holding a fixture and a real value passes,
# because the fixture clears the real value along with itself.
#
# Customer VOCABULARY — org codes, product prefixes, credential and object names — is
# deliberately absent here. This repo is public, so a denylist of those tokens would itself
# publish what it exists to catch. Those live in a local, uncommitted file the pre-commit
# hook reads; CI covers the structural shapes only. The two halves are not equivalent, and
# that asymmetry is the price of the repo being public.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Delimited, and exactly 15 or 18 characters - never a length between. An undelimited
  # prefix + {12,15} collides with git SHAs: a message quoting a hash beginning 888 read as a
  # connected-app id. A 40-character hash cannot satisfy the trailing delimiter. ERE has no
  # portable word boundary, hence the explicit classes; the delimiters are stripped back off
  # so the extracted value still compares exactly against the allowlist.
  IDS: '(^|[^A-Za-z0-9])(00D|005|0H4|888|00e)[A-Za-z0-9]{12}([A-Za-z0-9]{3})?([^A-Za-z0-9]|$)'
  FIXTURE_ID: '(00D|005|0H4|888|00e)[A-Za-z0-9]*([xX]{2}|0{9,})'
  HOST: '[A-Za-z0-9][A-Za-z0-9.-]*\.my\.salesforce\.com'
  FIXTURE_HOST: '^(acme|example|test|myorg|sample|demo|localhost|develop|sandbox|scratch|x)(--[A-Za-z0-9-]+)?(\.sandbox|\.develop)?\.my\.salesforce\.com$'
  GOVT_EMAIL: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]*(govt\.nz|health\.nz)'
  IP: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
  FIXTURE_IP: '^(10\.|127\.|192\.168\.|169\.254\.|172\.(1[6-9]|2[0-9]|3[01])\.|0\.|255\.255\.|192\.0\.2\.|198\.51\.100\.|203\.0\.113\.)'
  ALLOW: '.githooks/fixture-allowlist'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan tracked content
        run: |
          set -uo pipefail
          # GitHub runs `run:` under `bash -e`. `grep -c` exits 1 on a zero count, so a bare
          # assignment would abort the step before it could report - failing the build on a
          # clean tree. `|| true` keeps the count and drops the status.
          allow() { if [ -s "$ALLOW" ]; then grep -vxFf "$ALLOW"; else cat; fi; }
          pick() { sed -E 's/^[^A-Za-z0-9]+//; s/[^A-Za-z0-9]+$//'; }
          ids=$(git grep -hoIE "$IDS" -- . | pick | grep -vE "$FIXTURE_ID" | allow | grep -c . || true)
          hosts=$(git grep -hoIE "$HOST" -- . | grep -vE "$FIXTURE_HOST" | allow | grep -c . || true)
          mails=$(git grep -hoIE "$GOVT_EMAIL" -- . | allow | grep -c . || true)
          addrs=$(git grep -hoIE "$IP" -- . | grep -vE "$FIXTURE_IP" | allow | grep -c . || true)
          if [ "$ids" -ne 0 ] || [ "$hosts" -ne 0 ] || [ "$mails" -ne 0 ] || [ "$addrs" -ne 0 ]; then
            git grep -InE "$IDS" -- . | grep -vE "$FIXTURE_ID" | head -5 || true
            git grep -InE "$HOST" -- . | grep -vE "$FIXTURE_HOST" | head -5 || true
            git grep -InE "$GOVT_EMAIL" -- . | head -5 || true
            git grep -InE "$IP" -- . | grep -vE "$FIXTURE_IP" | head -5 || true
            echo "::error::Content references real org or customer data ($ids id(s), $hosts host(s), $mails address(es), $addrs IP(s))."
            exit 1
          fi
          echo "content: clean"

      - name: Scan for generated report artefacts
        run: |
          set -uo pipefail
          if git ls-files \
            | grep -IE '(^|/)(sf-audit-00D[A-Za-z0-9]*-[0-9]+|orgintel-(map|fingerprint|anatomy)-[A-Za-z0-9]+-[0-9]+)\.(json|html|md)$|(^|/)(coupling-graph|landscape-manifest)\.json$' ; then
            echo "::error::A generated report artefact is tracked. These contain org data."
            exit 1
          fi
          echo "artefacts: none tracked"

      - name: Scan commit messages
        run: |
          set -uo pipefail
          allow() { if [ -s "$ALLOW" ]; then grep -vxFf "$ALLOW"; else cat; fi; }
          pick() { sed -E 's/^[^A-Za-z0-9]+//; s/[^A-Za-z0-9]+$//'; }
          msgs=$(git log --format='%s%n%b')
          ids=$(printf '%s' "$msgs" | grep -hoE "$IDS" | pick | grep -vE "$FIXTURE_ID" | allow | grep -c . || true)
          hosts=$(printf '%s' "$msgs" | grep -hoE "$HOST" | grep -vE "$FIXTURE_HOST" | allow | grep -c . || true)
          mails=$(printf '%s' "$msgs" | grep -hoE "$GOVT_EMAIL" | allow | grep -c . || true)
          if [ "$ids" -ne 0 ] || [ "$hosts" -ne 0 ] || [ "$mails" -ne 0 ]; then
            echo "::error::A commit message references real org or customer data ($ids id(s), $hosts host(s), $mails address(es))."
            exit 1
          fi
          echo "commit messages: clean"

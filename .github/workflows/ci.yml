name: CI

# Build, test (incl. the read-only invariant guard), and audit dependencies on every
# push and PR. Make this a required status check on `main` so nothing merges red.
#
# Actions are pinned to commit SHAs (OpenSSF Scorecard "Pinned-Dependencies"); the
# trailing comment records the human-readable version. Dependabot (github-actions
# ecosystem) bumps both the SHA and the comment.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Fail the build on a known-vulnerable production dependency.
      - name: pnpm audit (production, high+)
        run: pnpm audit --prod --audit-level high

      # The step above audits THIS repo's lockfile, which has the pnpm.overrides block in
      # package.json applied to it. Nobody who installs the plugin gets those overrides:
      # npm and pnpm both honour overrides only in the root project, and this package is
      # always a dependency (`sf plugins install` puts it under the CLI's own root). So the
      # step above can pass on a tree no user has, while a high-severity advisory sits in
      # the tree they do have — exactly the false assurance this project exists to catch.
      #
      # This step audits what actually ships: pack the tarball, install it the way a user
      # installs it, and audit the tree that produces. It is a superset of the check above
      # for anything the overrides currently mask, and it is the one to look at first when
      # the two disagree.
      - name: npm audit (consumer tree, high+)
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm init -y > /dev/null
          npm install ./cclabsnz-sf-audit-*.tgz \
            --omit=dev --ignore-scripts --no-fund --no-audit
          npm audit --omit=dev --audit-level=high

  dependency-review:
    # PR-only: blocks a PR that introduces a dependency with a known vulnerability.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@cc4f6536e38d1126c5e3b0683d469a14f23bfea4 # v3
        with:
          fail-on-severity: high
          # License policy (regulated-environment readiness): block newly-introduced
          # dependencies under strong-copyleft licenses that are problematic to
          # redistribute in a permissively-licensed (Apache-2.0) CLI. Applies to
          # PR-added deps only; tune the list as needed.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          # Recorded exception, so the policy above stays true to what actually ships.
          # jszip declares "(MIT OR GPL-3.0-or-later)" and reaches us transitively through
          # @salesforce/core -> @jsforce/jsforce-node. A disjunction is the publisher offering
          # a choice: this project takes the MIT branch, which is why a GPL-denying policy and
          # a shipped jszip are not in conflict. Scanners that surface only the copyleft half
          # (Socket's "Copyleft License" alert does) are reading the same manifest, not
          # reporting a second licence. See docs/TRUST.md.
          allow-dependencies-licenses: pkg:npm/jszip

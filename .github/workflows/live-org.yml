name: Live org verification

# Runs the audit against a Developer Edition org the maintainers own and compares every finding's
# status with test/fixtures/live-org/baseline.json. A check that filters on a value Salesforce never
# writes, or reads a field that does not exist, still "passes"; only a known org shows it stopped
# finding what it used to. Also compares a fresh schema capture with the snapshot the query guard uses.
#
# The org's SFDX auth URL is the SF_LIVE_ORG_AUTH_URL secret of the `live-org` environment. Never a
# client org. Logs on this public repository are public: the scripts print check and finding ids,
# statuses and counts only, and no report is uploaded.
on:
  schedule:
    - cron: '0 18 * * 1' # Mondays 18:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/checks/**'
      - 'src/chains/**'
      - 'test/fixtures/live-org/**'

permissions:
  contents: read

# An explicit `bash` adds -o pipefail; the implicit default does not, and `node … | tee` would
# then always pass.
defaults:
  run:
    shell: bash

concurrency:
  group: live-org
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'cclabsnz/sf-audit-plugin'
    runs-on: ubuntu-latest
    environment: live-org
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      # Until the secret exists, say so and stop, rather than fail every week. With the secret but
      # no baseline, the compare step fails and says how to record one.
      - name: Check it is set up
        id: setup
        env:
          SF_LIVE_ORG_AUTH_URL: ${{ secrets.SF_LIVE_ORG_AUTH_URL }}
        run: |
          if [ -z "$SF_LIVE_ORG_AUTH_URL" ]; then
            echo "Live org verification is not set up: add SF_LIVE_ORG_AUTH_URL to the live-org environment (docs/RELEASE.md)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.setup.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        if: steps.setup.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install the Salesforce CLI and link this plugin
        if: steps.setup.outputs.ready == 'true'
        run: |
          npm install --global @salesforce/cli@2.154.4
          sf plugins link . --no-install

      - name: Log in to the live org
        if: steps.setup.outputs.ready == 'true'
        env:
          SF_LIVE_ORG_AUTH_URL: ${{ secrets.SF_LIVE_ORG_AUTH_URL }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/auth-url.txt"' EXIT
          printf '%s' "$SF_LIVE_ORG_AUTH_URL" > "$RUNNER_TEMP/auth-url.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/auth-url.txt" --alias live > /dev/null

      - name: Run the audit
        if: steps.setup.outputs.ready == 'true'
        run: |
          sf audit security --target-org live --format json --output "$RUNNER_TEMP/report" --no-history --json > /dev/null || true
          ls "$RUNNER_TEMP"/report/sf-audit-*.json > /dev/null

      - name: Compare with the baseline
        if: steps.setup.outputs.ready == 'true'
        run: node scripts/live-org-check.mjs "$(ls "$RUNNER_TEMP"/report/sf-audit-*.json | head -1)" test/fixtures/live-org/baseline.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare the schema with the snapshot
        if: always() && steps.setup.outputs.ready == 'true'
        run: |
          node scripts/capture-schema.mjs live "$RUNNER_TEMP/schema.json" > /dev/null
          node scripts/schema-drift.mjs test/fixtures/schema/developer-edition.json "$RUNNER_TEMP/schema.json" | tee -a "$GITHUB_STEP_SUMMARY"

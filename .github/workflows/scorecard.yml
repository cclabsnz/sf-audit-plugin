name: OpenSSF Scorecard

# Automated supply-chain health score (branch protection, pinned deps, token perms,
# signed releases, dangerous workflow patterns, ...). Publishes results to the public
# Scorecard dashboard so the badge in the README reflects a live, third-party audit.
on:
  branch_protection_rule:
  schedule:
    - cron: '18 5 * * 1' # Mondays 05:18 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # publish results to the public Scorecard API
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
